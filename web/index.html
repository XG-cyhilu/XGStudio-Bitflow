<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitFlow</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0 4.2-4.2M12 14l-4.2-4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 16.5v1.8A2.7 2.7 0 0 0 6.7 21h10.6A2.7 2.7 0 0 0 20 18.3v-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">BitFlow</span>
        <span class="brand-sub">XG STUDIO</span>
      </div>
    </div>

    <div class="nav-list" id="nav">
      <button class="nav-item is-active" data-view="tasks" data-filter="all">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.2"/></svg></span>
        <span class="nav-text">全部任务</span>
        <span class="nav-count" data-count="all">0</span>
      </button>
      <button class="nav-item" data-view="tasks" data-filter="active">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M10 3v8m0 0 3-3m-3 3-3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M4 13.5v1.7A1.8 1.8 0 0 0 5.8 17h8.4A1.8 1.8 0 0 0 16 15.2v-1.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="nav-text">下载中</span>
        <span class="nav-count" data-count="active">0</span>
      </button>
      <button class="nav-item" data-view="tasks" data-filter="completed">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.2"/><path d="m6.8 10.2 2.3 2.3 4.2-4.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="nav-text">已完成</span>
        <span class="nav-count" data-count="completed">0</span>
      </button>
      <button class="nav-item" data-view="tasks" data-filter="failed">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.2"/><path d="m7.6 7.6 4.8 4.8m0-4.8-4.8 4.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="nav-text">失败 / 取消</span>
        <span class="nav-count" data-count="failed">0</span>
      </button>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-list">
      <button class="nav-item" data-view="term">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4.5" width="14" height="11" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="m6.4 8.4 2 1.8-2 1.8M10.4 12.2h3.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="nav-text">终端</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.2"/><path d="M10 3.2v1.6M10 15.2v1.6M3.2 10h1.6M15.2 10h1.6M5.2 5.2l1.1 1.1M13.7 13.7l1.1 1.1M14.8 5.2l-1.1 1.1M6.3 13.7l-1.1 1.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="nav-text">设置</span>
      </button>
    </div>

    <div class="rail-footer">
      <div class="engine-chip">
        <span class="engine-dot"></span>
        <span id="engine-label">XGDL 引擎</span>
      </div>
    </div>
  </nav>

  <main class="workspace">
    <section class="view" data-view="tasks" id="view-tasks">
      <header class="commandbar">
        <div class="cmd-group">
          <button class="btn btn-accent" id="btn-add">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 4.2v11.6M4.2 10h11.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            新增下载
          </button>
          <span class="divider"></span>
          <button class="btn" id="btn-pause">全部暂停</button>
          <button class="btn" id="btn-resume">继续下载</button>
          <button class="btn btn-ghost" id="btn-cancelAll">全部取消</button>
        </div>
        <div class="cmd-status">
          <div class="speed-block">
            <span class="speed-value" id="speed">0 B/s</span>
            <span class="speed-label">总速度</span>
          </div>
        </div>
      </header>

      <div class="table-head">
        <span>文件</span>
        <span>速度</span>
        <span>进度</span>
        <span>状态</span>
        <span class="table-head-actions">操作</span>
      </div>

      <section class="list" id="list" aria-live="polite"></section>

      <div class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 96 72" fill="none"><rect x="14" y="10" width="68" height="46" rx="6" stroke="currentColor" stroke-width="1.2"/><path d="M14 22h68" stroke="currentColor" stroke-width="1.2"/><path d="M36 40v-9m0 0 3.6 3.6M36 31l-3.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="21" cy="16" r="1.6" fill="currentColor"/><circle cx="26" cy="16" r="1.6" fill="currentColor"/></svg>
        </div>
        <div class="empty-title">队列是空的</div>
        <div class="empty-sub">粘贴一个直链，BitFlow 会用多线程把它拉下来。</div>
        <button class="btn btn-accent" id="btn-empty-add">新增下载</button>
      </div>
    </section>

    <section class="view" data-view="term" id="view-term" hidden>
      <header class="commandbar">
        <div class="cmd-group">
          <h1 class="view-title">终端</h1>
          <span class="view-sub" id="term-status">内置 C++ core · 输入 help 查看命令</span>
        </div>
        <div class="cmd-group">
          <button class="btn btn-ghost" id="btn-clear-log">清屏</button>
          <button class="btn" id="btn-open-logdir">打开日志目录</button>
        </div>
      </header>
      <div class="log-list term-output" id="term-output"></div>
      <div class="term-input-row" id="term-input-row">
        <span class="term-prompt">❯</span>
        <input class="term-input" id="term-input" type="text" spellcheck="false" autocomplete="off"
               aria-label="终端命令">
      </div>
    </section>

    <section class="view" data-view="settings" id="view-settings" hidden>
      <header class="commandbar">
        <div class="cmd-group">
          <h1 class="view-title">设置</h1>
          <span class="view-sub">写入 settings.json</span>
        </div>
        <div class="cmd-group">
          <button class="btn" id="btn-probe">网络测速</button>
          <button class="btn btn-accent" id="btn-save-settings">保存设置</button>
        </div>
      </header>

      <div class="settings-scroll">
        <form class="settings-form" id="settings-form">
          <fieldset class="card">
            <legend>下载</legend>
            <label class="field">
              <span class="field-label">默认保存目录</span>
              <input class="input" id="s-downloadDir" type="text" spellcheck="false">
            </label>
            <label class="check">
              <input type="checkbox" id="s-autoExtract">
              <span>下载完成后自动解压 .zip 到同名目录</span>
            </label>
          </fieldset>

          <fieldset class="card">
            <legend>引擎（修改后需重启生效）</legend>
            <div class="field-row">
              <label class="field">
                <span class="field-label">小文件线程</span>
                <input class="input" id="s-smallThreads" type="text" inputmode="numeric">
              </label>
              <label class="field">
                <span class="field-label">大文件分块线程</span>
                <input class="input" id="s-largeThreads" type="text" inputmode="numeric">
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                <span class="field-label">最大连接数</span>
                <input class="input" id="s-maxConnections" type="text" inputmode="numeric">
              </label>
              <label class="field">
                <span class="field-label">单任务限速（KB/s，0 = 不限）</span>
                <input class="input" id="s-speedLimitKb" type="text" inputmode="numeric">
              </label>
            </div>
          </fieldset>

          <fieldset class="card">
            <legend>日志与网络</legend>
            <div class="field-row">
              <label class="field">
                <span class="field-label">控制台日志级别</span>
                <select class="input" id="s-logLevel">
                  <option value="trace">trace</option>
                  <option value="debug">debug</option>
                  <option value="info">info</option>
                  <option value="warn">warn</option>
                  <option value="error">error</option>
                  <option value="off">off</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">测速地址</span>
                <input class="input" id="s-probeUrl" type="text" spellcheck="false">
              </label>
            </div>
            <div class="probe-result" id="probe-result">尚未测速</div>
          </fieldset>

          <fieldset class="card">
            <legend>关于</legend>
            <dl class="about-grid">
              <dt>版本</dt>
              <dd id="about-version">—</dd>
              <dt>引擎</dt>
              <dd id="about-engine">XGDL</dd>
              <dt>安装 ID</dt>
              <dd id="about-installId">—</dd>
              <dt>日志目录</dt>
              <dd id="about-logDir">—</dd>
              <dt>配置文件</dt>
              <dd id="about-settingsPath">—</dd>
            </dl>
          </fieldset>

          <div class="settings-hint" id="settings-hint" hidden></div>
        </form>
      </div>
    </section>

    <footer class="statusbar">
      <span id="stat-queue">排队 0</span>
      <span class="dot">·</span>
      <span id="stat-active">活动 0</span>
      <span class="dot">·</span>
      <span id="stat-total">已下载 0 B</span>
      <span class="spacer"></span>
      <span id="stat-version">BitFlow 1.0.0</span>
    </footer>
  </main>
</div>

<dialog id="add-dialog" class="dialog">
  <form method="dialog" class="dialog-form" id="add-form">
    <div class="dialog-head">
      <h2>新增下载</h2>
      <p>支持 HTTP / HTTPS 直链、镜像回退与摘要校验。</p>
    </div>

    <label class="field">
      <span class="field-label">下载地址</span>
      <input class="input" id="f-url" type="text" spellcheck="false" placeholder="https://example.com/file.zip" required>
    </label>

    <label class="field">
      <span class="field-label">保存路径</span>
      <input class="input" id="f-path" type="text" spellcheck="false" placeholder="D:\Downloads\file.zip" required>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-label">预计大小（字节，可留空）</span>
        <input class="input" id="f-size" type="text" inputmode="numeric" placeholder="未知">
      </label>
      <label class="field">
        <span class="field-label">优先级</span>
        <select class="input" id="f-priority">
          <option value="normal">普通</option>
          <option value="high">高</option>
          <option value="low">低</option>
        </select>
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span class="field-label">校验算法</span>
        <select class="input" id="f-algo">
          <option value="none">不校验</option>
          <option value="sha256">SHA-256</option>
          <option value="sha1">SHA-1</option>
          <option value="md5">MD5</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">摘要值</span>
        <input class="input" id="f-digest" type="text" spellcheck="false" placeholder="十六进制">
      </label>
    </div>

    <label class="field">
      <span class="field-label">镜像源（每行一个，主源失败后按顺序尝试）</span>
      <textarea class="input textarea" id="f-mirrors" spellcheck="false" rows="3" placeholder="https://mirror.example.com/file.zip"></textarea>
    </label>

    <div class="dialog-error" id="dialog-error" hidden></div>

    <div class="dialog-actions">
      <button type="button" class="btn" id="btn-cancel-add">取消</button>
      <button type="submit" class="btn btn-accent" id="btn-start">开始下载</button>
    </div>
  </form>
</dialog>

<template id="row-template">
  <article class="row" data-state="queued">
    <div class="cell-file">
      <div class="file-line">
        <span class="file-name"></span>
        <span class="file-host"></span>
        <span class="hash-chip" hidden></span>
      </div>
      <div class="file-sub"></div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>
    <div class="cell-speed">—</div>
    <div class="cell-progress">—</div>
    <div class="cell-state"><span class="badge">排队中</span></div>
    <div class="cell-actions">
      <button class="icon-btn act-extract" title="解压" hidden>
        <svg viewBox="0 0 20 20" fill="none"><rect x="3.4" y="4.4" width="13.2" height="11.2" rx="1.4" stroke="currentColor" stroke-width="1.2"/><path d="M10 6.6v6.8M7.6 9l2.4-2.4 2.4 2.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn act-open" title="打开所在文件夹" hidden>
        <svg viewBox="0 0 20 20" fill="none"><path d="M3.4 6.6v8.2A1.4 1.4 0 0 0 4.8 16.2h10.4A1.4 1.4 0 0 0 16.6 14.8V8.2A1.4 1.4 0 0 0 15.2 6.8H9.4L7.8 4.6H4.8A1.4 1.4 0 0 0 3.4 6z" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="icon-btn act-cancel" title="取消任务">
        <svg viewBox="0 0 20 20" fill="none"><path d="m7.4 7.4 5.2 5.2m0-5.2-5.2 5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </article>
</template>

<div class="toast" id="toast" hidden></div>

<script src="js/bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
